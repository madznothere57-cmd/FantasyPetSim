<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MythKeep</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --castle-bg:#1a1a2e;--castle-mid:#16213e;--castle-accent:#0f3460;
  --gold:#e2b04a;--gold-light:#f5d07a;--stone:#8b7d6b;--stone-light:#b8a99a;
  --hp-green:#4caf7d;--mood-yellow:#f5c842;--quest-blue:#4a9eff;--rest-purple:#9b6dff;
}
body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Nunito',sans-serif;}
.app{background:var(--castle-bg);width:660px;border-radius:12px;overflow:hidden;color:#e8dcc8;box-shadow:0 8px 40px rgba(0,0,0,0.7);}
.castle-header{background:var(--castle-mid);border-bottom:3px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.castle-title{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);letter-spacing:1px;}
.castle-subtitle{font-size:11px;color:var(--stone-light);margin-top:3px;}
.day-badge{background:var(--castle-accent);border:2px solid var(--gold);border-radius:8px;padding:4px 10px;font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold-light);}
.main-area{display:grid;grid-template-columns:1fr 200px;height:480px;}
.dragon-room{background:linear-gradient(180deg,#1a1a2e 0%,#0d1b2a 60%,#1a0a0a 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:20px;overflow:hidden;}
.stars{position:absolute;top:0;left:0;right:0;height:45%;pointer-events:none;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;}
.torch{position:absolute;top:80px;width:14px;display:flex;flex-direction:column;align-items:center;}
.torch-left{left:24px;}.torch-right{right:24px;}
.torch-flame{width:10px;height:14px;background:#ff6b2b;border-radius:50% 50% 30% 30%;animation:flicker 0.3s infinite alternate;position:relative;}
.torch-flame::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:8px;background:#ffd700;border-radius:50% 50% 30% 30%;}
@keyframes flicker{from{transform:scaleX(1) rotate(-2deg);}to{transform:scaleX(0.85) rotate(2deg);}}
.torch-stick{width:6px;height:20px;background:#6b4c2a;border-radius:0 0 2px 2px;}
.floor-tiles{position:absolute;bottom:0;left:0;right:0;height:60px;background:repeating-linear-gradient(90deg,#2a1a1a 0px,#2a1a1a 39px,#1a0a0a 39px,#1a0a0a 40px);border-top:3px solid #4a2a2a;}
.dragon-bed{position:absolute;bottom:12px;left:16px;z-index:8;}
.dragon-wrap{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;}
.dragon-name-tag{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);text-align:center;margin-bottom:6px;text-shadow:2px 2px 0 rgba(0,0,0,0.5);}
.sprite-area{position:relative;width:180px;height:180px;flex-shrink:0;}
.sprite-window{width:180px;height:180px;position:relative;overflow:hidden;}
#sprite-img{position:absolute;display:block;visibility:hidden;mix-blend-mode:lighten;image-rendering:pixelated;image-rendering:crisp-edges;max-width:none;max-height:none;}
#outfit-items-layer{position:absolute;inset:0;pointer-events:none;z-index:15;overflow:visible;}
.outfit-item{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;transform:translate(-50%,-50%);transition:box-shadow 0.15s;}
.outfit-item.selected{outline:2px dashed var(--gold);outline-offset:3px;border-radius:4px;}

/* Dress mode tap-to-place overlay */
.place-overlay{position:absolute;inset:0;z-index:40;display:none;cursor:crosshair;border:2px dashed var(--gold);border-radius:8px;background:rgba(226,176,74,0.06);}
.place-overlay.active{display:block;}
.place-hint{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:5px;color:var(--gold);white-space:nowrap;}

/* Dress mode top bar */
.wardrobe-mode-bar{position:absolute;top:0;left:0;right:0;z-index:50;background:rgba(16,20,40,0.95);border-bottom:2px solid var(--gold);padding:6px 10px;display:none;align-items:center;justify-content:space-between;}
.wardrobe-mode-bar.active{display:flex;}
.wardrobe-mode-label{font-family:'Press Start 2P',monospace;font-size:5px;color:var(--gold);line-height:1.6;}
.wardrobe-mode-done{background:var(--hp-green);border:none;border-radius:6px;color:#fff;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap;}

/* Item controls panel — shown when item selected */
.item-controls{position:absolute;bottom:-56px;left:50%;transform:translateX(-50%);z-index:60;background:var(--castle-mid);border:1.5px solid var(--gold);border-radius:10px;padding:8px 12px;display:none;align-items:center;gap:10px;white-space:nowrap;}
.item-controls.active{display:flex;}
.item-controls-label{font-family:'Press Start 2P',monospace;font-size:5px;color:var(--gold);}
.size-slider{width:90px;accent-color:var(--gold);}
.item-remove-btn{background:none;border:1.5px solid #ff6b6b;border-radius:6px;color:#ff6b6b;font-size:10px;font-weight:700;padding:3px 7px;cursor:pointer;font-family:'Nunito',sans-serif;}
.item-remove-btn:hover{background:#ff6b6b;color:#fff;}

.sleeping-wrap{display:none;position:relative;z-index:10;flex-direction:column;align-items:center;}
.sleeping-sprite{font-size:56px;animation:sleepbob 2s ease-in-out infinite;}
@keyframes sleepbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.zzz{position:absolute;top:-10px;right:-10px;font-family:'Press Start 2P',monospace;font-size:8px;color:#9b6dff;animation:zzz 1.5s ease-in-out infinite;}
@keyframes zzz{0%{opacity:0;transform:translateY(0) scale(0.8);}50%{opacity:1;}100%{opacity:0;transform:translateY(-14px) scale(1.1);}}
.sleep-name{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--rest-purple);text-align:center;margin-top:4px;}
.speech-bubble{position:absolute;bottom:210px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1a2e;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;white-space:nowrap;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,0.4);animation:popIn 0.2s ease-out;pointer-events:none;}
.speech-bubble::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:none;}
@keyframes popIn{from{transform:translateX(-50%) scale(0.5);opacity:0;}to{transform:translateX(-50%) scale(1);opacity:1;}}
.quest-away{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;}
.quest-icon{font-size:48px;animation:float 2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.quest-text{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--quest-blue);margin-top:8px;}
.quest-timer{font-size:13px;color:var(--stone-light);margin-top:6px;}
.sidebar{background:var(--castle-mid);border-left:3px solid var(--gold);display:flex;flex-direction:column;padding:12px;gap:12px;overflow:hidden;}
.stat-block{display:flex;flex-direction:column;gap:6px;}
.stat-label{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--stone-light);}
.stat-bar-bg{height:10px;background:#0d1b2a;border-radius:5px;border:1.5px solid var(--castle-accent);overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:5px;transition:width 0.5s ease;}
.stat-bar-fill.hunger{background:var(--gold);}
.stat-bar-fill.mood{background:var(--mood-yellow);}
.stat-bar-fill.energy{background:var(--hp-green);}
.stat-value{font-family:'Press Start 2P',monospace;font-size:6px;color:#e8dcc8;text-align:right;}
.divider{height:1px;background:var(--castle-accent);flex-shrink:0;}
.section-label{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--gold);}
.action-btn{background:var(--castle-accent);border:2px solid var(--stone);border-radius:8px;color:#e8dcc8;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:8px 10px;cursor:pointer;transition:all 0.15s;text-align:left;display:flex;align-items:center;gap:6px;width:100%;}
.action-btn:hover:not(:disabled){background:#1a3a5c;border-color:var(--gold);color:var(--gold-light);transform:translateY(-1px);}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;}
.action-btn.quest-btn{border-color:var(--quest-blue);color:var(--quest-blue);}
.action-btn.quest-btn:hover:not(:disabled){background:#0a2040;border-color:#7bc4ff;color:#7bc4ff;}
.action-btn.rest-btn{border-color:var(--rest-purple);color:var(--rest-purple);}
.action-btn.rest-btn:hover:not(:disabled){background:#1a0a30;border-color:#c4a0ff;color:#c4a0ff;}
.action-btn.wardrobe-btn{border-color:#ff9eb5;color:#ff9eb5;}
.action-btn.wardrobe-btn:hover:not(:disabled){background:#2a0a18;border-color:#ffccd8;color:#ffccd8;}
.action-btn.return-btn{border-color:var(--hp-green);color:var(--hp-green);animation:pulse-btn 1s ease-in-out infinite;}
@keyframes pulse-btn{0%,100%{box-shadow:0 0 0 0 rgba(76,175,125,0.4);}50%{box-shadow:0 0 0 6px rgba(76,175,125,0);}}
.wake-btn{border-color:var(--mood-yellow)!important;color:var(--mood-yellow)!important;}
.wake-btn:hover:not(:disabled){background:#1a1500!important;border-color:#ffe066!important;color:#ffe066!important;}
.action-section{display:flex;flex-direction:column;gap:8px;}
.inventory-section{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;}
.inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.inv-slot{background:#0d1b2a;border:1.5px solid var(--castle-accent);border-radius:6px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:border-color 0.15s;}
.inv-slot:hover:not(.empty){border-color:var(--gold);}
.inv-slot.empty{opacity:0.3;cursor:default;}

/* Wardrobe panel */
.wardrobe-panel{position:fixed;inset:0;z-index:199;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;justify-content:center;}
.wardrobe-sheet{background:var(--castle-mid);border:2px solid var(--gold);border-radius:16px 16px 0 0;width:660px;max-height:72vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,0.8);}
.wardrobe-header{background:var(--castle-bg);border-bottom:2px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-radius:14px 14px 0 0;}
.wardrobe-title{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);}
.wardrobe-close{background:none;border:1.5px solid var(--stone);border-radius:6px;color:var(--stone-light);font-size:14px;cursor:pointer;padding:4px 10px;font-family:'Nunito',sans-serif;font-weight:700;}
.wardrobe-tabs{display:flex;border-bottom:1.5px solid var(--castle-accent);}
.tab-btn{flex:1;padding:10px;font-family:'Press Start 2P',monospace;font-size:6px;color:var(--stone-light);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.wardrobe-body{padding:12px;overflow-y:auto;flex:1;}
.clothes-section-label{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--gold);margin:10px 0 8px;}
.clothes-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:4px;}
.clothes-card{background:var(--castle-bg);border:1.5px solid var(--castle-accent);border-radius:10px;padding:6px;text-align:center;cursor:pointer;transition:all 0.15s;position:relative;user-select:none;}
.clothes-card:hover:not(.locked){border-color:var(--gold);transform:translateY(-2px);}
.clothes-card.selected-item{border-color:#ff9eb5;background:#1a0a12;box-shadow:0 0 0 2px #ff9eb5;}
.clothes-card.placed{border-color:var(--hp-green);}
.clothes-card.placed::after{content:'📍';position:absolute;top:2px;right:4px;font-size:9px;}
.clothes-card.locked{opacity:0.4;cursor:default;}
.clothes-card canvas{width:48px;height:48px;image-rendering:pixelated;margin-bottom:2px;display:block;margin-left:auto;margin-right:auto;}
.clothes-card .placeholder{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 2px;}
.clothes-name{font-size:8px;font-weight:700;color:#e8dcc8;line-height:1.2;}
.clothes-card.locked .clothes-name{color:var(--stone-light);}

/* Selected item info bar */
.selected-bar{background:var(--castle-bg);border:1.5px solid #ff9eb5;border-radius:10px;padding:10px 14px;margin-bottom:10px;display:none;align-items:center;gap:12px;}
.selected-bar.active{display:flex;}
.selected-bar-img{width:40px;height:40px;image-rendering:pixelated;flex-shrink:0;}
.selected-bar-info{flex:1;}
.selected-bar-name{font-family:'Press Start 2P',monospace;font-size:6px;color:#ff9eb5;margin-bottom:4px;}
.selected-bar-hint{font-size:10px;color:var(--stone-light);}
.selected-bar-cancel{background:none;border:1.5px solid var(--stone);border-radius:6px;color:var(--stone-light);font-size:11px;font-weight:700;padding:4px 8px;cursor:pointer;font-family:'Nunito',sans-serif;flex-shrink:0;}

.shop-note{font-size:11px;color:var(--stone-light);text-align:center;margin-top:8px;line-height:1.6;}
.item-popup{position:fixed;z-index:300;background:var(--castle-mid);border:2px solid var(--gold);border-radius:12px;padding:16px;min-width:180px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.7);animation:popIn 0.15s ease-out;top:50%;left:50%;transform:translate(-50%,-50%);}
.item-popup-emoji{font-size:40px;margin-bottom:8px;}
.item-popup-name{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);line-height:1.6;margin-bottom:6px;}
.item-popup-desc{font-size:11px;color:var(--stone-light);margin-bottom:12px;line-height:1.5;}
.item-popup-close{background:var(--castle-accent);border:1.5px solid var(--stone);border-radius:6px;color:#e8dcc8;font-family:'Nunito',sans-serif;font-size:11px;font-weight:700;padding:5px 14px;cursor:pointer;margin:0 4px;}
.popup-overlay{position:fixed;inset:0;z-index:299;background:rgba(0,0,0,0.4);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--castle-mid);border:2px solid var(--gold);border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;color:var(--gold-light);white-space:nowrap;z-index:100;animation:toastIn 0.3s ease-out;pointer-events:none;}
@keyframes toastIn{from{transform:translateX(-50%) translateY(20px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
@keyframes twinkle{from{opacity:0.3;}to{opacity:1;}}
</style>
</head>
<body>
<div class="app">
  <div class="castle-header">
    <div><div class="castle-title">MYTHKEEP</div><div class="castle-subtitle">Your cozy fantasy castle</div></div>
    <div class="day-badge" id="day-badge">DAY 1</div>
  </div>
  <div class="main-area">
    <div class="dragon-room" id="dragon-room">
      <div class="stars" id="stars"></div>
      <div class="torch torch-left"><div class="torch-flame"></div><div class="torch-stick"></div></div>
      <div class="torch torch-right"><div class="torch-flame"></div><div class="torch-stick"></div></div>
      <div class="floor-tiles"></div>
      <div class="wardrobe-mode-bar" id="wardrobe-mode-bar">
        <div class="wardrobe-mode-label">👗 TAP EMBER TO PLACE<br>TAP ITEM TO ADJUST SIZE</div>
        <button class="wardrobe-mode-done" onclick="exitDressMode()">✓ Done</button>
      </div>
      <div class="dragon-bed">
        <svg width="90" height="48" viewBox="0 0 90 48" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="20" width="82" height="24" rx="3" fill="#3a1a0a"/>
          <rect x="8" y="16" width="74" height="20" rx="3" fill="#7b3f6e"/>
          <rect x="10" y="14" width="22" height="14" rx="4" fill="#e8c4d8"/>
          <rect x="30" y="18" width="50" height="16" rx="3" fill="#4a2a6e"/>
          <rect x="36" y="21" width="6" height="4" rx="1" fill="#6a4a9e" opacity="0.6"/>
          <rect x="48" y="21" width="6" height="4" rx="1" fill="#6a4a9e" opacity="0.6"/>
          <rect x="60" y="21" width="6" height="4" rx="1" fill="#6a4a9e" opacity="0.6"/>
          <rect x="2" y="10" width="14" height="34" rx="3" fill="#5a2a0e"/>
          <circle cx="9" cy="24" r="3" fill="#e2b04a" opacity="0.8"/>
          <rect x="8" y="40" width="6" height="8" rx="1" fill="#3a1a0a"/>
          <rect x="76" y="40" width="6" height="8" rx="1" fill="#3a1a0a"/>
        </svg>
      </div>
      <div class="dragon-wrap" id="dragon-wrap">
        <div class="dragon-name-tag">EMBER</div>
        <div class="sprite-area" id="sprite-area">
          <div class="sprite-window" id="sprite-window" onclick="handleSpriteClick(event)">
            <img id="sprite-img" src="IMG_0228.png" alt="">
          </div>
          <img id="eating-img" src="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:none;mix-blend-mode:lighten;z-index:11;" alt="">
          <div id="outfit-items-layer"></div>
          <!-- Tap to place overlay -->
          <div class="place-overlay" id="place-overlay" onclick="handleSpriteClick(event)">
            <div class="place-hint">TAP TO PLACE</div>
          </div>
          <!-- Item controls (size slider + remove) -->
          <div class="item-controls" id="item-controls">
            <span class="item-controls-label">SIZE</span>
            <input type="range" class="size-slider" id="size-slider" min="30" max="140" value="70" oninput="onSizeChange(this.value)">
            <button class="item-remove-btn" onclick="removeSelected()">✕ Remove</button>
          </div>
        </div>
      </div>
      <div class="sleeping-wrap" id="sleeping-wrap">
        <div style="position:relative;display:inline-block;">
          <div class="sleeping-sprite">🐉</div>
          <div class="zzz">z z z</div>
        </div>
        <div class="sleep-name">EMBER IS RESTING...</div>
      </div>
      <div class="quest-away" id="quest-away">
        <div class="quest-icon">🗺️</div>
        <div class="quest-text">ON QUEST!</div>
        <div class="quest-timer" id="quest-timer-text">Returns soon...</div>
      </div>
    </div>
    <div class="sidebar">
      <div class="stat-block">
        <div style="display:flex;justify-content:space-between"><span class="stat-label">HUNGER</span><span class="stat-value" id="hunger-val">80%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill hunger" id="hunger-bar" style="width:80%"></div></div>
        <div style="display:flex;justify-content:space-between"><span class="stat-label">MOOD</span><span class="stat-value" id="mood-val">70%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill mood" id="mood-bar" style="width:70%"></div></div>
        <div style="display:flex;justify-content:space-between"><span class="stat-label">ENERGY</span><span class="stat-value" id="energy-val">100%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill energy" id="energy-bar" style="width:100%"></div></div>
      </div>
      <div class="divider"></div>
      <div class="action-section">
        <div class="section-label">ACTIONS</div>
        <button class="action-btn" id="feed-btn" onclick="feedDragon()">🍖 Feed</button>
        <button class="action-btn" id="pet-btn" onclick="petDragon()">✨ Pet</button>
        <button class="action-btn rest-btn" id="rest-btn" onclick="restDragon()">🛏️ Rest</button>
        <button class="action-btn rest-btn wake-btn" id="wake-btn" onclick="wakeDragon()" style="display:none">☀️ Wake Up</button>
        <button class="action-btn quest-btn" id="quest-btn" onclick="sendOnQuest()">⚔️ Send on Quest</button>
        <button class="action-btn wardrobe-btn" id="wardrobe-btn" onclick="openWardrobe()">👗 Wardrobe</button>
        <button class="action-btn return-btn" id="return-btn" onclick="returnFromQuest()" style="display:none">🎁 Ember's Back!</button>
      </div>
      <div class="divider"></div>
      <div class="inventory-section">
        <div class="section-label">LOOT CHEST</div>
        <div class="inventory-grid" id="inv-grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
const CLOTH_COORDS={
  witch_hat:   {sx:36, sy:9,   sw:219,sh:196},
  cowboy_hat:  {sx:317,sy:9,   sw:211,sh:196},
  pink_bow:    {sx:622,sy:9,   sw:164,sh:196},
  gem_necklace:{sx:911,sy:9,   sw:154,sh:196},
  tuxedo:      {sx:1175,sy:9,  sw:186,sh:196},
  crown:       {sx:76, sy:211, sw:136,sh:168},
  pirate_hat:  {sx:317,sy:211, sw:211,sh:168},
  sunglasses:  {sx:604,sy:211, sw:188,sh:168},
  heart_locket:{sx:921,sy:211, sw:136,sh:168},
  kimono:      {sx:1175,sy:211,sw:186,sh:168},
  top_hat:     {sx:50, sy:387, sw:185,sh:173},
  flower_crown:{sx:311,sy:387, sw:213,sh:173},
  scarf:       {sx:624,sy:387, sw:157,sh:173},

const keyedClothing={};
const clothingSheet=new Image();

const dragonImg=document.getElementById('sprite-img');

function isGreen(r,g,b){return g>180&&r<120&&b<120;}

function buildClothingCache(){
  const off=document.createElement('canvas');
  off.width=clothingSheet.naturalWidth;off.height=clothingSheet.naturalHeight;
  const octx=off.getContext('2d');octx.drawImage(clothingSheet,0,0);
  Object.entries(CLOTH_COORDS).forEach(([id,c])=>{
    const src=octx.getImageData(c.sx,c.sy,c.sw,c.sh);
    const d=src.data;
    for(let i=0;i<d.length;i+=4){if(isGreen(d[i],d[i+1],d[i+2]))d[i+3]=0;}
    const cv=document.createElement('canvas');cv.width=c.sw;cv.height=c.sh;
    cv.getContext('2d').putImageData(src,0,0);
    keyedClothing[id]=cv;
  });
  renderOutfitLayer();
}
clothingSheet.onload=buildClothingCache;

function getPreviewCanvas(id,size=48){
  const src=keyedClothing[id];if(!src)return null;
  const cv=document.createElement('canvas');cv.width=src.width;cv.height=src.height;
  cv.style.cssText=`width:${size}px;height:${size}px;image-rendering:pixelated;display:block;margin:0 auto 2px;`;
  cv.getContext('2d').drawImage(src,0,0);return cv;
}

// === OUTFIT LAYER ===
function renderOutfitLayer(){
  const layer=document.getElementById('outfit-items-layer');
  layer.innerHTML='';
  Object.entries(state.equipped).forEach(([id,pos])=>{
    const src=keyedClothing[id];if(!src)return;
    const cv=document.createElement('canvas');
    cv.width=src.width;cv.height=src.height;
    cv.getContext('2d').drawImage(src,0,0);
    cv.className='outfit-item'+(state.focusedPlaced===id?' selected':'');
    cv.style.cssText=`position:absolute;left:${pos.xPct}%;top:${pos.yPct}%;width:${pos.size}px;height:${pos.size}px;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:${state.inDressMode?'auto':'none'};cursor:${state.inDressMode?'pointer':'default'};`;
    cv.onclick=(e)=>{
      if(!state.inDressMode)return;
      e.stopPropagation();
      focusPlacedItem(id);
    };
    layer.appendChild(cv);
  });
}

// === DRESS MODE ===
function enterDressMode(){
  state.inDressMode=true;
  document.getElementById('wardrobe-mode-bar').classList.add('active');
  document.getElementById('dragon-wrap').style.cursor='default';
  renderOutfitLayer();
}

function exitDressMode(){
  state.inDressMode=false;
  state.selectedItem=null;
  state.focusedPlaced=null;
  document.getElementById('wardrobe-mode-bar').classList.remove('active');
  document.getElementById('place-overlay').classList.remove('active');
  document.getElementById('item-controls').classList.remove('active');
  document.getElementById('dragon-wrap').style.cursor='pointer';
  renderOutfitLayer();
  renderWardrobe();
}

// User tapped an item card in wardrobe → select it
function selectItemForPlacing(id){
  if(!CLOTHES[id]?.owned)return;
  state.selectedItem=id;
  state.focusedPlaced=null;
  closeWardrobe();
  enterDressMode();
  document.getElementById('place-overlay').classList.add('active');
  document.getElementById('item-controls').classList.remove('active');
  showToast('Now tap Ember where you want the '+CLOTHES[id].name+'!');
}

// User tapped on sprite area while item selected → place it
function handleSpriteClick(e){
  if(!state.inDressMode)return;
  const area=document.getElementById('sprite-area');
  const rect=area.getBoundingClientRect();
  const clientX=e.touches?e.touches[0].clientX:e.clientX;
  const clientY=e.touches?e.touches[0].clientY:e.clientY;
  const xPct=Math.round(((clientX-rect.left)/rect.width)*100);
  const yPct=Math.round(((clientY-rect.top)/rect.height)*100);

  if(state.selectedItem){
    // Place new item
    const id=state.selectedItem;
    const defaultSize=CLOTHES[id].slot==='hat'?70:CLOTHES[id].slot==='acc'?60:80;
    state.equipped[id]={xPct,yPct,size:defaultSize};
    state.selectedItem=null;
    document.getElementById('place-overlay').classList.remove('active');
    showSpeech(rand(speech.dress));
    focusPlacedItem(id);
    renderOutfitLayer();
    renderWardrobe();
  } else if(state.focusedPlaced){
    // Reposition existing focused item
    state.equipped[state.focusedPlaced].xPct=xPct;
    state.equipped[state.focusedPlaced].yPct=yPct;
    renderOutfitLayer();
  } else {
    // Tapped empty area — deselect
    state.focusedPlaced=null;
    document.getElementById('item-controls').classList.remove('active');
    renderOutfitLayer();
  }
}

// Tap a placed item → show size controls
function focusPlacedItem(id){
  state.focusedPlaced=id;
  const pos=state.equipped[id];
  const slider=document.getElementById('size-slider');
  slider.value=pos.size;
  document.getElementById('item-controls').classList.add('active');
  renderOutfitLayer();
}

function onSizeChange(val){
  if(!state.focusedPlaced)return;
  state.equipped[state.focusedPlaced].size=parseInt(val);
  renderOutfitLayer();
}

function removeSelected(){
  if(!state.focusedPlaced)return;
  const id=state.focusedPlaced;
  delete state.equipped[id];
  state.focusedPlaced=null;
  document.getElementById('item-controls').classList.remove('active');
  renderOutfitLayer();
  renderWardrobe();
  showToast(CLOTHES[id].emoji+' '+CLOTHES[id].name+' removed!');
}

// === WARDROBE ===
let wardrobeTab='wardrobe';
function openWardrobe(){wardrobeTab='wardrobe';renderWardrobePanel();}

function renderWardrobePanel(){
  document.querySelector('.wardrobe-panel')?.remove();
  const panel=document.createElement('div');panel.className='wardrobe-panel';
  panel.onclick=(e)=>{if(e.target===panel)closeWardrobe();};
  const sheet=document.createElement('div');sheet.className='wardrobe-sheet';
  sheet.innerHTML=`
    <div class="wardrobe-header">
      <div class="wardrobe-title">👗 EMBER'S WARDROBE</div>
      <button class="wardrobe-close" onclick="closeWardrobe()">✕ Close</button>
    </div>
    <div class="wardrobe-tabs">
      <button class="tab-btn ${wardrobeTab==='wardrobe'?'active':''}" onclick="switchTab('wardrobe')">🧺 My Items</button>
      <button class="tab-btn ${wardrobeTab==='shop'?'active':''}" onclick="switchTab('shop')">🛍️ Shop</button>
    </div>
    <div class="wardrobe-body" id="wardrobe-body"></div>
  `;
  panel.appendChild(sheet);document.body.appendChild(panel);
  renderWardrobe();
}

function switchTab(tab){
  wardrobeTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.textContent.includes(tab==='wardrobe'?'My Items':'Shop')));
  renderWardrobe();
}

function renderWardrobe(){
  const body=document.getElementById('wardrobe-body');if(!body)return;
  body.innerHTML='';

  if(wardrobeTab==='wardrobe'){
    // Instruction bar
    const hint=document.createElement('div');
    hint.style.cssText='font-size:11px;color:var(--stone-light);background:var(--castle-bg);border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.5;';
    hint.textContent='👆 Tap an item to select it, then tap Ember to place it. Tap placed items to resize or remove.';
    body.appendChild(hint);

    ['hat','acc','body'].forEach(slot=>{
      const label={hat:'🎩 Hats',acc:'✨ Accessories',body:'👘 Outfits'}[slot];
      const items=Object.values(CLOTHES).filter(c=>c.slot===slot&&c.owned);
      if(!items.length)return;
      const lbl=document.createElement('div');lbl.className='clothes-section-label';lbl.textContent=label;body.appendChild(lbl);
      const grid=document.createElement('div');grid.className='clothes-grid';
      items.forEach(item=>{
        const isPlaced=!!state.equipped[item.id];
        const card=document.createElement('div');
        card.className='clothes-card'+(isPlaced?' placed':'');
        card.title=item.desc;
        const cv=getPreviewCanvas(item.id);
        if(cv)card.appendChild(cv);
        else{const ph=document.createElement('div');ph.className='placeholder';ph.textContent=item.emoji;card.appendChild(ph);}
        const n=document.createElement('div');n.className='clothes-name';n.textContent=item.name;card.appendChild(n);
        card.onclick=()=>{
          if(isPlaced){
            // Already placed — enter dress mode and focus it
            closeWardrobe();
            enterDressMode();
            focusPlacedItem(item.id);
          } else {
            selectItemForPlacing(item.id);
          }
        };
        grid.appendChild(card);
      });
      body.appendChild(grid);
    });

    const locked=Object.values(CLOTHES).filter(c=>!c.owned);
    if(locked.length){
      const lbl=document.createElement('div');lbl.className='clothes-section-label';lbl.style.color='var(--stone-light)';lbl.textContent='🔒 Not Yet Found';body.appendChild(lbl);
      const grid=document.createElement('div');grid.className='clothes-grid';
      locked.forEach(()=>{
        const card=document.createElement('div');card.className='clothes-card locked';
        const ph=document.createElement('div');ph.className='placeholder';ph.textContent='❓';card.appendChild(ph);
        const n=document.createElement('div');n.className='clothes-name';n.style.color='var(--stone-light)';n.textContent='???';card.appendChild(n);
        grid.appendChild(card);
      });
      body.appendChild(grid);
    }
  } else {
    const lbl=document.createElement('div');lbl.className='clothes-section-label';lbl.textContent='🛍️ Free Shop — Claim anything!';body.appendChild(lbl);
    const shopItems=Object.values(CLOTHES).filter(c=>!c.owned);
    if(!shopItems.length){
      const note=document.createElement('p');note.className='shop-note';note.textContent='🎉 You own everything! Send Ember on quests for secret items.';body.appendChild(note);
    } else {
      const grid=document.createElement('div');grid.className='clothes-grid';
      shopItems.forEach(item=>{
        const card=document.createElement('div');card.className='clothes-card';card.title=item.desc;
        const cv=getPreviewCanvas(item.id);
        if(cv)card.appendChild(cv);
        else{const ph=document.createElement('div');ph.className='placeholder';ph.textContent=item.emoji;card.appendChild(ph);}
        const n=document.createElement('div');n.className='clothes-name';n.textContent=item.name;card.appendChild(n);
        const t=document.createElement('div');t.style.cssText='font-size:8px;color:var(--hp-green);margin-top:2px;';t.textContent='FREE';card.appendChild(t);
        card.onclick=()=>claimShopItem(item.id);
        grid.appendChild(card);
      });
      body.appendChild(grid);
    }
    const note=document.createElement('p');note.className='shop-note';note.textContent='💡 Ember can also bring back clothes from quests!';body.appendChild(note);
  }
}

function claimShopItem(id){
  if(CLOTHES[id]){CLOTHES[id].owned=true;showToast(CLOTHES[id].emoji+' '+CLOTHES[id].name+' added to wardrobe!');}
  renderWardrobe();
}

function closeWardrobe(){document.querySelector('.wardrobe-panel')?.remove();}

// === SPRITE ===
function showFrame(){
  const frames=FRAMES[state.currentAnim];if(!frames)return;
  const f=frames[state.animFrame%frames.length];
  const scale=Math.min(WIN/f.sw,WIN/f.sh)*0.88;
  dragonImg.style.width=Math.round(SHEET_W*scale)+'px';dragonImg.style.height=Math.round(SHEET_H*scale)+'px';
  dragonImg.style.left=Math.round((WIN-f.sw*scale)/2-f.sx*scale)+'px';dragonImg.style.top=Math.round((WIN-f.sh*scale)/2-f.sy*scale)+'px';
  dragonImg.style.visibility='visible';
}

function playAnim(name,opts={}){
  if(state.animTimer){clearInterval(state.animTimer);state.animTimer=null;}
  const eatingImg=document.getElementById('eating-img');
  eatingImg.style.display='none';
  dragonImg.style.visibility='visible';
  if(name==='eating'){
    state.currentAnim=name;state.animFrame=0;
    dragonImg.style.visibility='hidden';
    eatingImg.style.display='block';
    eatingImg.src=EATING_FRAMES[0];
    state.animTimer=setInterval(()=>{
      state.animFrame++;
      if(opts.once&&state.animFrame>=EATING_FRAMES.length){
        clearInterval(state.animTimer);state.animTimer=null;
        eatingImg.style.display='none';dragonImg.style.visibility='visible';
        if(opts.onDone)opts.onDone();return;
      }
      eatingImg.src=EATING_FRAMES[state.animFrame%EATING_FRAMES.length];
    },190);
    return;
  }
  state.currentAnim=name;state.animFrame=0;showFrame();
  const frames=FRAMES[name];const speed=SPEEDS[name]||150;
  state.animTimer=setInterval(()=>{
    state.animFrame++;
    if(opts.once&&state.animFrame>=frames.length){clearInterval(state.animTimer);state.animTimer=null;if(opts.onDone)opts.onDone();return;}
    showFrame();
  },speed);
}

function rand(a){return a[Math.floor(Math.random()*a.length)];}

function showSpeech(text){
  document.querySelector('.speech-bubble')?.remove();
  if(state.speechTimeout)clearTimeout(state.speechTimeout);
  const b=document.createElement('div');b.className='speech-bubble';b.textContent=text;
  document.getElementById('dragon-room').appendChild(b);
  state.speechTimeout=setTimeout(()=>b.remove(),2200);
}

function showToast(text){
  document.querySelector('.toast')?.remove();
  if(state.toastTimeout)clearTimeout(state.toastTimeout);
  const t=document.createElement('div');t.className='toast';t.textContent=text;
  document.body.appendChild(t);
  state.toastTimeout=setTimeout(()=>t.remove(),2800);
}

function updateStats(){
  const cl=v=>Math.max(0,Math.min(100,v));
  state.hunger=cl(state.hunger);state.mood=cl(state.mood);state.energy=cl(state.energy);
  ['hunger','mood','energy'].forEach(s=>{
    document.getElementById(s+'-bar').style.width=state[s]+'%';
    document.getElementById(s+'-val').textContent=Math.round(state[s])+'%';
  });
}

function syncButtons(){
  const busy=state.onQuest||state.isResting;
  document.getElementById('feed-btn').disabled=busy||state.feedCooldown;
  document.getElementById('pet-btn').disabled=busy||state.petCooldown;
  document.getElementById('rest-btn').style.display=busy?'none':'flex';
  document.getElementById('wake-btn').style.display=state.isResting?'flex':'none';
  document.getElementById('quest-btn').style.display=busy?'none':'flex';
  document.getElementById('wardrobe-btn').style.display=state.onQuest?'none':'flex';
  document.getElementById('return-btn').style.display=(state.questPhase==='returned')?'flex':'none';
}

function showDragon(){document.getElementById('dragon-wrap').style.display='flex';}
function hideDragon(){document.getElementById('dragon-wrap').style.display='none';}

function restDragon(){
  if(state.onQuest||state.isResting||state.energy>=100)return;
  state.isResting=true;syncButtons();showSpeech(rand(speech.rest));
  hideDragon();document.getElementById('sleeping-wrap').style.display='flex';
  state.restInterval=setInterval(()=>{state.energy=Math.min(100,state.energy+5);updateStats();if(state.energy>=100)wakeDragon();},2000);
}

function wakeDragon(){
  if(!state.isResting)return;state.isResting=false;
  if(state.restInterval){clearInterval(state.restInterval);state.restInterval=null;}
  document.getElementById('sleeping-wrap').style.display='none';showDragon();syncButtons();
  showSpeech(rand(speech.wake));playAnim('happy');
  setTimeout(()=>{if(!state.onQuest&&!state.isResting)playAnim('idle');},2000);
}

function feedDragon(){
  if(state.onQuest||state.feedCooldown||state.isResting)return;
  state.feedCooldown=true;state.hunger=Math.min(100,state.hunger+25);state.mood=Math.min(100,state.mood+5);
  updateStats();showSpeech(rand(speech.feed));playAnim('eating');syncButtons();
  setTimeout(()=>{state.feedCooldown=false;syncButtons();playAnim('idle');},2400);
}

function petDragon(){
  if(state.onQuest||state.petCooldown||state.isResting||state.inDressMode)return;
  state.petCooldown=true;state.mood=Math.min(100,state.mood+20);
  updateStats();showSpeech(rand(speech.pet));playAnim('happy');syncButtons();
  setTimeout(()=>{state.petCooldown=false;syncButtons();playAnim('idle');},2000);
}

function sendOnQuest(){
  if(state.onQuest||state.isResting||state.energy<20)return;
  if(state.inDressMode)exitDressMode();
  state.onQuest=true;state.questPhase='departing';
  state.energy=Math.max(0,state.energy-30);
  updateStats();showSpeech(rand(speech.quest));syncButtons();
  const depDuration=SPEEDS.quest_departure*FRAMES.quest_departure.length+300;
  let depDone=false;
  function onDepart(){
    if(depDone)return;depDone=true;state.questPhase='away';
    hideDragon();document.getElementById('quest-away').style.display='block';
    const duration=12000+Math.random()*6000;
    let remaining=Math.ceil(duration/1000);
    const timerEl=document.getElementById('quest-timer-text');
    const cd=setInterval(()=>{remaining--;timerEl.textContent=remaining>0?`Returns in ${remaining}s...`:'Returning...';if(remaining<=0)clearInterval(cd);},1000);
    setTimeout(()=>{
      clearInterval(cd);
      document.getElementById('quest-away').style.display='none';showDragon();
      state.onQuest=false;state.questPhase='returning';
      state.energy=Math.min(100,state.energy+10);state.day++;updateStats();
      document.getElementById('day-badge').textContent='DAY '+state.day;
      const retDuration=SPEEDS.quest_return*FRAMES.quest_return.length+300;
      let retDone=false;
      function onReturn(){if(retDone)return;retDone=true;state.questPhase='returned';playAnim('idle');showSpeech(rand(speech.return));syncButtons();}
      playAnim('quest_return',{once:true,onDone:onReturn});
      setTimeout(onReturn,retDuration);
    },duration);
  }
  playAnim('quest_departure',{once:true,onDone:onDepart});
  setTimeout(onDepart,depDuration);
}

function returnFromQuest(){
  if(state.questPhase!=='returned')return;
  state.questPhase='idle';syncButtons();
  const unowned=questLootPool.filter(l=>l.type==='clothes'&&!CLOTHES[l.clothesId].owned);
  const pool=Math.random()<0.35&&unowned.length?unowned:questLootPool.filter(l=>l.type==='item');
  const loot=rand(pool);
  if(loot.type==='clothes'){
    const item=CLOTHES[loot.clothesId];item.owned=true;
    state.inventory.push({emoji:item.emoji,name:item.name,isClothes:true,clothesId:item.id});
    showToast(item.emoji+' '+item.name+' — new clothing!');
  } else {
    state.inventory.push({emoji:loot.emoji,name:loot.name});
    showToast('Ember found: '+loot.emoji+' '+loot.name+'!');
  }
  renderInventory();
}

function showItemPopup(item){
  document.querySelector('.popup-overlay')?.remove();document.querySelector('.item-popup')?.remove();
  const overlay=document.createElement('div');overlay.className='popup-overlay';overlay.onclick=closePopup;document.body.appendChild(overlay);
  const popup=document.createElement('div');popup.className='item-popup';
  const desc=item.isClothes?CLOTHES[item.clothesId]?.desc:itemDescs[item.emoji]||'A curious treasure.';
  const extra=item.isClothes?`<button class="item-popup-close" style="border-color:#ff9eb5;color:#ff9eb5;" onclick="closePopup();openWardrobe()">Open Wardrobe</button>`:'';
  popup.innerHTML=`<div class="item-popup-emoji">${item.emoji}</div><div class="item-popup-name">${item.name.toUpperCase()}</div><div class="item-popup-desc">${desc}</div><div style="display:flex;justify-content:center;gap:8px">${extra}<button class="item-popup-close" onclick="closePopup()">Close</button></div>`;
  document.body.appendChild(popup);
}

function closePopup(){document.querySelector('.popup-overlay')?.remove();document.querySelector('.item-popup')?.remove();}

function renderInventory(){
  const grid=document.getElementById('inv-grid');grid.innerHTML='';
  for(let i=0;i<9;i++){
    const s=document.createElement('div');
    if(state.inventory[i]){
      s.className='inv-slot';s.textContent=state.inventory[i].emoji;s.title=state.inventory[i].name;
      if(state.inventory[i].isClothes)s.style.borderColor='#ff9eb5';
      const item=state.inventory[i];s.onclick=()=>showItemPopup(item);
    }else{s.className='inv-slot empty';s.textContent='·';}
    grid.appendChild(s);
  }
}

function generateStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<24;i++){
    const s=document.createElement('div');s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation:twinkle ${1.5+Math.random()}s ${Math.random()*2}s infinite alternate;opacity:${0.3+Math.random()*0.7}`;
    c.appendChild(s);
  }
}

// Handle touch on sprite-window too
document.getElementById('sprite-window').addEventListener('touchend',e=>{
  if(!state.inDressMode)return;
  e.preventDefault();
  handleSpriteClick(e.changedTouches[0]);
},{passive:false});

generateStars();renderInventory();updateStats();syncButtons();
dragonImg.onload=()=>playAnim('idle');
dragonImg.onerror=()=>{document.querySelector('.sprite-window').innerHTML='<div style="font-size:80px;line-height:180px;text-align:center">🐉</div>';};
setInterval(()=>{
  if(!state.onQuest){
    state.hunger=Math.max(0,state.hunger-1.5);state.mood=Math.max(0,state.mood-0.8);
    if(!state.isResting)state.energy=Math.min(100,state.energy+1);
    updateStats();
  }
},8000);
</script>
</body>
</html>
