<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MythKeep</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --castle-bg:#1a1a2e;--castle-mid:#16213e;--castle-accent:#0f3460;
  --gold:#e2b04a;--gold-light:#f5d07a;--stone:#8b7d6b;--stone-light:#b8a99a;
  --hp-green:#4caf7d;--mood-yellow:#f5c842;--quest-blue:#4a9eff;
}
body{background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Nunito',sans-serif;}
.app{background:var(--castle-bg);width:660px;border-radius:12px;overflow:hidden;color:#e8dcc8;box-shadow:0 8px 40px rgba(0,0,0,0.7);}
.castle-header{background:var(--castle-mid);border-bottom:3px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.castle-title{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);letter-spacing:1px;}
.castle-subtitle{font-size:11px;color:var(--stone-light);margin-top:3px;}
.day-badge{background:var(--castle-accent);border:2px solid var(--gold);border-radius:8px;padding:4px 10px;font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold-light);}
.main-area{display:grid;grid-template-columns:1fr 200px;}
.dragon-room{background:linear-gradient(180deg,#1a1a2e 0%,#0d1b2a 60%,#1a0a0a 100%);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:20px;min-height:480px;overflow:hidden;}
.stars{position:absolute;top:0;left:0;right:0;height:45%;pointer-events:none;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;}
.torch{position:absolute;top:80px;width:14px;display:flex;flex-direction:column;align-items:center;}
.torch-left{left:24px;}.torch-right{right:24px;}
.torch-flame{width:10px;height:14px;background:#ff6b2b;border-radius:50% 50% 30% 30%;animation:flicker 0.3s infinite alternate;position:relative;}
.torch-flame::after{content:'';position:absolute;top:2px;left:2px;width:6px;height:8px;background:#ffd700;border-radius:50% 50% 30% 30%;}
@keyframes flicker{from{transform:scaleX(1) rotate(-2deg);}to{transform:scaleX(0.85) rotate(2deg);}}
.torch-stick{width:6px;height:20px;background:#6b4c2a;border-radius:0 0 2px 2px;}
.floor-tiles{position:absolute;bottom:0;left:0;right:0;height:60px;background:repeating-linear-gradient(90deg,#2a1a1a 0px,#2a1a1a 39px,#1a0a0a 39px,#1a0a0a 40px);border-top:3px solid #4a2a2a;}
.dragon-wrap{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.dragon-canvas{width:160px;height:160px;image-rendering:pixelated;image-rendering:crisp-edges;}
.dragon-name-tag{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--gold);text-align:center;margin-bottom:6px;text-shadow:2px 2px 0 rgba(0,0,0,0.5);}
.speech-bubble{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:#fff;color:#1a1a2e;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:700;white-space:nowrap;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,0.4);animation:popIn 0.2s ease-out;pointer-events:none;}
.speech-bubble::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#fff;border-bottom:none;}
@keyframes popIn{from{transform:translateX(-50%) scale(0.5);opacity:0;}to{transform:translateX(-50%) scale(1);opacity:1;}}
.quest-away{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;}
.quest-icon{font-size:48px;animation:float 2s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.quest-text{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--quest-blue);margin-top:8px;}
.quest-timer{font-size:13px;color:var(--stone-light);margin-top:6px;}
.sidebar{background:var(--castle-mid);border-left:3px solid var(--gold);display:flex;flex-direction:column;padding:12px;gap:12px;}
.stat-block{display:flex;flex-direction:column;gap:6px;}
.stat-label{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--stone-light);}
.stat-bar-bg{height:10px;background:#0d1b2a;border-radius:5px;border:1.5px solid var(--castle-accent);overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:5px;transition:width 0.5s ease;}
.stat-bar-fill.hunger{background:var(--gold);}
.stat-bar-fill.mood{background:var(--mood-yellow);}
.stat-bar-fill.energy{background:var(--hp-green);}
.stat-value{font-family:'Press Start 2P',monospace;font-size:6px;color:#e8dcc8;text-align:right;}
.divider{height:1px;background:var(--castle-accent);}
.section-label{font-family:'Press Start 2P',monospace;font-size:6px;color:var(--gold);}
.action-btn{background:var(--castle-accent);border:2px solid var(--stone);border-radius:8px;color:#e8dcc8;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:8px 10px;cursor:pointer;transition:all 0.15s;text-align:left;display:flex;align-items:center;gap:6px;width:100%;}
.action-btn:hover:not(:disabled){background:#1a3a5c;border-color:var(--gold);color:var(--gold-light);transform:translateY(-1px);}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;}
.action-btn.quest-btn{border-color:var(--quest-blue);color:var(--quest-blue);}
.action-btn.quest-btn:hover:not(:disabled){background:#0a2040;border-color:#7bc4ff;color:#7bc4ff;}
.action-btn.return-btn{border-color:var(--hp-green);color:var(--hp-green);animation:pulse-btn 1s ease-in-out infinite;}
@keyframes pulse-btn{0%,100%{box-shadow:0 0 0 0 rgba(76,175,125,0.4);}50%{box-shadow:0 0 0 6px rgba(76,175,125,0);}}
.action-section{display:flex;flex-direction:column;gap:8px;}
.inventory-section{flex:1;display:flex;flex-direction:column;gap:8px;}
.inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.inv-slot{background:#0d1b2a;border:1.5px solid var(--castle-accent);border-radius:6px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:border-color 0.15s;position:relative;}
.inv-slot:hover{border-color:var(--gold);}
.inv-slot.empty{opacity:0.3;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--castle-mid);border:2px solid var(--gold);border-radius:10px;padding:8px 16px;font-size:12px;font-weight:700;color:var(--gold-light);white-space:nowrap;z-index:100;animation:toastIn 0.3s ease-out;pointer-events:none;}
@keyframes toastIn{from{transform:translateX(-50%) translateY(20px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
</style>
</head>
<body>
<div class="app">
  <div class="castle-header">
    <div>
      <div class="castle-title">MYTHKEEP</div>
      <div class="castle-subtitle">Your cozy fantasy castle</div>
    </div>
    <div class="day-badge" id="day-badge">DAY 1</div>
  </div>
  <div class="main-area">
    <div class="dragon-room" id="dragon-room">
      <div class="stars" id="stars"></div>
      <div class="torch torch-left"><div class="torch-flame"></div><div class="torch-stick"></div></div>
      <div class="torch torch-right"><div class="torch-flame"></div><div class="torch-stick"></div></div>
      <div class="floor-tiles"></div>
      <div class="dragon-wrap" id="dragon-wrap" onclick="petDragon()">
        <div class="dragon-name-tag">EMBER</div>
        <canvas class="dragon-canvas" id="dragon-canvas" width="160" height="160"></canvas>
      </div>
      <div class="quest-away" id="quest-away">
        <div class="quest-icon">🗺️</div>
        <div class="quest-text">ON QUEST!</div>
        <div class="quest-timer" id="quest-timer-text">Returns soon...</div>
      </div>
    </div>
    <div class="sidebar">
      <div class="stat-block">
        <div style="display:flex;justify-content:space-between"><span class="stat-label">HUNGER</span><span class="stat-value" id="hunger-val">80%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill hunger" id="hunger-bar" style="width:80%"></div></div>
        <div style="display:flex;justify-content:space-between"><span class="stat-label">MOOD</span><span class="stat-value" id="mood-val">70%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill mood" id="mood-bar" style="width:70%"></div></div>
        <div style="display:flex;justify-content:space-between"><span class="stat-label">ENERGY</span><span class="stat-value" id="energy-val">100%</span></div>
        <div class="stat-bar-bg"><div class="stat-bar-fill energy" id="energy-bar" style="width:100%"></div></div>
      </div>
      <div class="divider"></div>
      <div class="action-section">
        <div class="section-label">ACTIONS</div>
        <button class="action-btn" id="feed-btn" onclick="feedDragon()">🍖 Feed</button>
        <button class="action-btn" id="pet-btn" onclick="petDragon()">✨ Pet</button>
        <button class="action-btn quest-btn" id="quest-btn" onclick="sendOnQuest()">⚔️ Send on Quest</button>
        <button class="action-btn return-btn" id="return-btn" onclick="returnFromQuest()" style="display:none">🎁 Ember's Back!</button>
      </div>
      <div class="divider"></div>
      <div class="inventory-section">
        <div class="section-label">LOOT CHEST</div>
        <div class="inventory-grid" id="inv-grid"></div>
      </div>
    </div>
  </div>
</div>

const imgs = {};
function preload() {
  let total = 0, loaded = 0;
  for (const [anim, frames] of Object.entries(DRAGON_FRAMES)) {
    imgs[anim] = [];
    for (const src of frames) {
      total++;
      const img = new Image();
      img.onload = () => { loaded++; if (loaded === total) startGame(); };
      img.src = src;
      imgs[anim].push(img);
    }
  }
}

const ctx = canvas.getContext('2d');

function drawFrame() {
  ctx.clearRect(0, 0, 160, 160);
  const frames = imgs[state.currentAnim];
  if (!frames || !frames.length) return;
  const f = state.animFrame % frames.length;
  const img = frames[f];
  // Center and scale to fit 160x160
  const scale = Math.min(160/img.naturalWidth, 160/img.naturalHeight);
  const w = img.naturalWidth * scale;
  const h = img.naturalHeight * scale;
  ctx.drawImage(img, (160-w)/2, (160-h)/2, w, h);
}

function playAnim(name, opts={}) {
  if (state.animTimer) clearInterval(state.animTimer);
  state.currentAnim = name;
  state.animFrame = 0;
  drawFrame();
  const frames = imgs[name];
  const speed = animSpeeds[name] || 150;
  state.animTimer = setInterval(() => {
    state.animFrame++;
    if (opts.once && state.animFrame >= frames.length) {
      clearInterval(state.animTimer);
      if (opts.onDone) opts.onDone();
      return;
    }
    drawFrame();
  }, speed);
}

function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function showSpeech(text) {
  document.querySelector('.speech-bubble')?.remove();
  if (state.speechTimeout) clearTimeout(state.speechTimeout);
  const room = document.getElementById('dragon-room');
  const b = document.createElement('div');
  b.className = 'speech-bubble';
  b.textContent = text;
  room.appendChild(b);
  state.speechTimeout = setTimeout(() => b.remove(), 2200);
}

function showToast(text) {
  document.querySelector('.toast')?.remove();
  if (state.toastTimeout) clearTimeout(state.toastTimeout);
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  state.toastTimeout = setTimeout(() => t.remove(), 2800);
}

function updateStats() {
  const cl = v => Math.max(0, Math.min(100, v));
  state.hunger = cl(state.hunger); state.mood = cl(state.mood); state.energy = cl(state.energy);
  document.getElementById('hunger-bar').style.width = state.hunger+'%';
  document.getElementById('mood-bar').style.width = state.mood+'%';
  document.getElementById('energy-bar').style.width = state.energy+'%';
  document.getElementById('hunger-val').textContent = Math.round(state.hunger)+'%';
  document.getElementById('mood-val').textContent = Math.round(state.mood)+'%';
  document.getElementById('energy-val').textContent = Math.round(state.energy)+'%';
}

function feedDragon() {
  if (state.onQuest || state.feedCooldown) return;
  state.feedCooldown = true;
  state.hunger = Math.min(100, state.hunger+25);
  state.mood = Math.min(100, state.mood+5);
  updateStats();
  showSpeech(rand(speech.feed));
  playAnim('eating', {once:false});
  document.getElementById('feed-btn').disabled = true;
  setTimeout(() => {
    state.feedCooldown = false;
    document.getElementById('feed-btn').disabled = false;
    playAnim('idle');
  }, 2400);
}

function petDragon() {
  if (state.onQuest || state.petCooldown) return;
  state.petCooldown = true;
  state.mood = Math.min(100, state.mood+20);
  updateStats();
  showSpeech(rand(speech.pet));
  playAnim('happy', {once:false});
  document.getElementById('pet-btn').disabled = true;
  setTimeout(() => {
    state.petCooldown = false;
    document.getElementById('pet-btn').disabled = false;
    playAnim('idle');
  }, 2000);
}

function sendOnQuest() {
  if (state.onQuest || state.energy < 20) return;
  state.onQuest = true;
  state.energy = Math.max(0, state.energy-30);
  updateStats();
  showSpeech(rand(speech.quest));
  document.getElementById('quest-btn').style.display = 'none';
  document.getElementById('feed-btn').disabled = true;
  document.getElementById('pet-btn').disabled = true;

  playAnim('quest_departure', {once:true, onDone:() => {
    document.getElementById('dragon-wrap').style.display = 'none';
    document.getElementById('quest-away').style.display = 'block';
  }});

  const duration = 12000 + Math.random()*6000;
  let remaining = Math.ceil(duration/1000);
  const timerEl = document.getElementById('quest-timer-text');
  const countdown = setInterval(() => {
    remaining--;
    timerEl.textContent = remaining > 0 ? `Returns in ${remaining}s...` : 'Returning...';
    if (remaining <= 0) clearInterval(countdown);
  }, 1000);

  setTimeout(() => {
    clearInterval(countdown);
    document.getElementById('quest-away').style.display = 'none';
    const wrap = document.getElementById('dragon-wrap');
    wrap.style.display = 'flex';
    state.onQuest = false;
    state.questReady = true;
    state.energy = Math.min(100, state.energy+10);
    updateStats();
    state.day++;
    document.getElementById('day-badge').textContent = 'DAY '+state.day;
    playAnim('quest_return', {once:true, onDone:() => {
      playAnim('idle');
      showSpeech(rand(speech.return));
      document.getElementById('return-btn').style.display = 'block';
      document.getElementById('feed-btn').disabled = false;
      document.getElementById('pet-btn').disabled = false;
    }});
  }, duration);
}

function returnFromQuest() {
  document.getElementById('return-btn').style.display = 'none';
  document.getElementById('quest-btn').style.display = 'block';
  state.questReady = false;
  const loot = rand(questLoot);
  state.inventory.push(loot);
  renderInventory();
  showToast('Ember found: '+loot.emoji+' '+loot.name+'!');
}

function renderInventory() {
  const grid = document.getElementById('inv-grid');
  grid.innerHTML = '';
  for (let i=0; i<9; i++) {
    const slot = document.createElement('div');
    slot.className = 'inv-slot' + (state.inventory[i] ? '' : ' empty');
    slot.textContent = state.inventory[i] ? state.inventory[i].emoji : '·';
    if (state.inventory[i]) slot.title = state.inventory[i].name;
    grid.appendChild(slot);
  }
}

function generateStars() {
  const c = document.getElementById('stars');
  for (let i=0; i<24; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation:twinkle ${1.5+Math.random()}s ${Math.random()*2}s infinite alternate;opacity:${0.3+Math.random()*0.7}`;
    c.appendChild(s);
  }
}

function startGame() {
  playAnim('idle');
  renderInventory();
  updateStats();
  setInterval(() => {
    if (!state.onQuest) {
      state.hunger = Math.max(0, state.hunger-1.5);
      state.mood = Math.max(0, state.mood-0.8);
      updateStats();
    }
  }, 8000);
}

const style = document.createElement('style');
style.textContent = '@keyframes twinkle{from{opacity:0.3}to{opacity:1}}';
document.head.appendChild(style);

generateStars();
preload();
</script>
</body>
